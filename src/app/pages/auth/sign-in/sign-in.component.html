<section class="auth-form">
  <div class="text-center">
    <h3 class="h3">Sign In</h3>
  </div>
  <div *ngIf="mockAuthEnabled" class="alert alert-info py-2" role="alert">
    Demo mode without backend. Use <strong>demo</strong> / <strong>demo</strong>
  </div>
  <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input
        type="text"
        class="form-control"
        formControlName="username"
        [ngClass]="{ 'is-invalid': submitted && f['username'].errors }"
      />
      <div *ngIf="submitted && f['username'].errors" class="invalid-feedback">
        <div *ngIf="f['username'].errors['required']">Username is required</div>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input
        type="password"
        class="form-control"
        formControlName="password"
        [ngClass]="{ 'is-invalid': submitted && f['password'].errors }"
      />
      <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
        <div *ngIf="f['password'].errors['required']">Password is required</div>
      </div>
    </div>
    <div class="d-grid">
      <button
        type="submit"
        class="btn btn-primary d-flex align-items-center justify-content-center gap-2"
        [disabled]="loading"
      >
        <span
          *ngIf="loading"
          class="spinner-border spinner-border-sm"
          role="status"
          aria-hidden="true"
        ></span>
        <span>{{ loading ? 'Please wait...' : 'Sign In' }}</span>
      </button>
    </div>
    <div class="text-center mt-5">
      <a routerLink="/sign-up" class="text-black">Create new account</a>
    </div>
  </form>
</section>

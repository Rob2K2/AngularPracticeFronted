<div class="card mb-3" style="max-width: 540px">
  <div class="row g-0">
    <div class="col-md-4">
      <img
        [src]="avatarUrl"
        class="card-img"
        [alt]="userProfile.username + ' avatar'"
      />
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">User Information</h5>
        <p class="card-text">
          Username: <strong>{{ userProfile.username }}</strong>
        </p>
        <p class="card-text">
          Email: <strong>{{ userProfile.email }}</strong>
        </p>
        <p class="card-text">
          Registered: <strong>{{ userProfile.registerDate | date: 'medium' }}</strong>
        </p>
      </div>
    </div>
  </div>
</div>
